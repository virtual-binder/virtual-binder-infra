name: Deploy API

on:
  workflow_dispatch:
    inputs:
      api_image:
        description: "Digest inmutable de la imagen de la API"
        required: true
        type: string
  repository_dispatch:
    types: [api-image-built]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: envs/prod
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_github_actions_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      TF_VAR_cors_origins: ${{ vars.CORS_ORIGINS }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_api_image: ${{ inputs.api_image || github.event.client_payload.image }}
      TF_VAR_billing_account: ${{ vars.GCP_BILLING_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Validate image input
        run: test -n "$TF_VAR_api_image"

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=virtual-binder/prod"

      - run: terraform validate

      - run: terraform plan -input=false -lock-timeout=5m -out=deploy.tfplan

      - run: terraform apply -input=false -auto-approve deploy.tfplan
