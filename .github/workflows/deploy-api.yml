name: Deploy API

on:
  workflow_dispatch:
    inputs:
      api_image:
        description: "Digest inmutable de la imagen de la API en ECR"
        required: true
        type: string
  repository_dispatch:
    types: [api-image-built]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: envs/prod
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_api_image: ${{ inputs.api_image || github.event.client_payload.image }}
      TF_VAR_cors_origins: ${{ vars.CORS_ORIGINS }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Validate image input
        run: test -n "$TF_VAR_api_image"

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="dynamodb_table=${{ vars.TF_STATE_TABLE }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - run: terraform validate

      - run: terraform plan -input=false -lock-timeout=5m -out=deploy.tfplan

      - run: terraform apply -input=false -auto-approve deploy.tfplan
