name: Terraform plan

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "envs/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/prod
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_github_actions_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      TF_VAR_cors_origins: ${{ vars.CORS_ORIGINS }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_api_image: ${{ vars.API_IMAGE }}
      TF_VAR_billing_account: ${{ vars.GCP_BILLING_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive ../..

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=virtual-binder/prod"

      - run: terraform validate

      - run: terraform plan -input=false -lock-timeout=5m
