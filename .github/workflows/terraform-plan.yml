name: Terraform plan

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "envs/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/prod
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_api_image: ${{ vars.API_IMAGE }}
      TF_VAR_cors_origins: ${{ vars.CORS_ORIGINS }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive ../..

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="dynamodb_table=${{ vars.TF_STATE_TABLE }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - run: terraform validate

      - run: terraform plan -input=false -lock-timeout=5m
